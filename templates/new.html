{% extends 'base.html' %}{% block content %}<a href="{{url_for('index')}}" class="back">← Dashboard</a><div class="pagehead"><div><span class="eyebrow">EXPAND YOUR NETWORK</span><h1>Add a professor</h1><p>Capture the person and the research before writing.</p></div></div><section class="card newform"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Full name<input name="name" required placeholder="Professor name"></label><label>Email<input name="email" type="email" required placeholder="professor@university.edu"></label><label>College / University<input name="university"></label><label>State<input name="state" placeholder="e.g. Ohio"></label><label>Category<input name="category" list="category-list" placeholder="None" maxlength="80" autocomplete="off"></label><label>Department<input name="department"></label><label>Photo URL (optional)<input name="photo_url" type="url" placeholder="https://.../photo.jpg"></label><label>Research focus<textarea name="research" rows="5"></textarea></label><label>Why this research fits<textarea name="alignment" rows="4"></textarea></label><label>Notes<textarea name="notes" rows="3"></textarea></label><button class="btn primary">Save professor</button></form></section>{% endblock %}
